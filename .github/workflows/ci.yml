name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The MCP release workflow runs these gates before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Reads the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mcp/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The MCP package has its own manifest and lockfile.
      # Install it before its check and build gates.
      - run: pnpm --dir mcp install --frozen-lockfile

      # Runs `react-router typegen`, `tsc --noEmit` and `prettier --check`.
      - run: pnpm run check

      - run: pnpm run lint
