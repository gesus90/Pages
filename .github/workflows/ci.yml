name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pages-check:
    name: Pages check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # This workflow runs only check and lint, without tests.
      - name: Check
        run: pnpm run check

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run lint
