name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The MCP release workflow runs exactly these gates before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Reads the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mcp/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The MCP package has its own manifest and lockfile. The root tests import
      # its sources and its installed SDK, so it is installed before any gate.
      - run: pnpm --dir mcp install --frozen-lockfile

      # Runs `react-router typegen`, `tsc --noEmit` and `prettier --check`.
      - run: pnpm run check

      - run: pnpm run lint

      # Type check and format check of the MCP package.
      - run: pnpm --dir mcp run check

      # Every test, with the 100% per-file coverage thresholds. A failing test
      # or a coverage miss fails the job.
      - run: pnpm test

      - run: pnpm run build

      - run: pnpm --dir mcp run build

      - run: pnpm audit --prod --audit-level=high
