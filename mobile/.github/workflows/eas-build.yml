name: eas-build

# Starts an EAS cloud build by hand. It needs an Expo account: create an access
# token at expo.dev, store it as the repository secret EXPO_TOKEN and the id that
# `eas init` prints as the repository variable EAS_PROJECT_ID. Signing
# credentials are created once with `eas credentials` and stay at Expo.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios]
        default: android
      profile:
        description: Build profile of eas.json
        type: choice
        options: [development, development-simulator, preview, production]
        default: preview

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      PLATFORM: ${{ inputs.platform }}
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile

      # `--no-wait` ends the job once EAS has queued the build; follow it at
      # expo.dev.
      - run: eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait
