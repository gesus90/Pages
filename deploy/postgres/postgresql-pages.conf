# Settings of the Pages cluster for the running backup. Add to postgresql.conf with
# `include` and replace @CHECKOUT@ and @MOUNT_UUID@; the archive directory must exist.

# A commit that the server confirmed survives a crash.
fsync = on
full_page_writes = on
synchronous_commit = on

wal_level = replica
max_wal_senders = 4

# Starting the archiver needs a restart of the server, changing the command does not.
archive_mode = on
archive_command = '@CHECKOUT@/deploy/postgres/archive-wal.sh @MOUNT_UUID@ /mnt/Data/PagesPostgres/wal "%p" "%f"'
# At most 5 minutes of confirmed changes are only on the disk of the server.
archive_timeout = 300
