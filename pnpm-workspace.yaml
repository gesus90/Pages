allowBuilds:
  esbuild: true

# Supply-chain protection: only install package versions published at least
# 10 days (14400 minutes) ago. Compromised releases are usually discovered
# and withdrawn quickly, so they never reach us. Applies to transitive
# dependencies as well. Setting this explicitly enables strict mode: if no
# version in the requested range meets the minimum age, resolution fails
# instead of falling back to a younger version.
minimumReleaseAge: 14400

# Transitive dependencies of @react-router/serve with published advisories
# (qs: GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g; morgan: GHSA-jxfw-x594-9x9m).
# Remove once @react-router/serve depends on the fixed versions itself.
overrides:
  morgan: ">=1.12.1 <2"
  qs: ">=6.16.0 <7"

# pnpm derives the default from `CI`, so an install with `CI=true` and a later
# run without it disagree: pnpm calls the modules stale and wants to purge them,
# which aborts without a terminal (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY).
enableGlobalVirtualStore: false

# Gates run unattended. Stale modules fail with a message instead of a silent
# install, which could purge them in the middle of a run; the setup step is
# `node scripts/qa-evidence.mjs preflight --scope pages --install`.
verifyDepsBeforeRun: error
