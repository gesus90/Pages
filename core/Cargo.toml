[package]
name = "pages-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Holds the live-change SSE streams and the WebSocket connections of Pages and delivers the events of the outbox."
license-file = "../LICENSE"
publish = false

[dependencies]
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
toml = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
